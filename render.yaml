# render.yaml — place this in the ROOT of your repo (above backend/ and frontend/)
# Render reads this file to auto-configure all services.
# Docs: https://render.com/docs/blueprint-spec

services:
  # ── Backend (Express + Prisma) ──────────────────────────────────────────────
  - type: web
    name: moon-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: moon-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true        # Render auto-generates a secure random value
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        value: https://moon-frontend.onrender.com   # ← update after frontend deploys

  # ── Frontend (React static site) ────────────────────────────────────────────
  - type: web
    name: moon-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html    # Required for React Router client-side routing
    envVars:
      - key: REACT_APP_API_URL
        value: https://moon-backend.onrender.com/api  # ← update after backend deploys

# ── PostgreSQL Database ──────────────────────────────────────────────────────
databases:
  - name: moon-db
    plan: free
    databaseName: moondb
    user: moonuser
